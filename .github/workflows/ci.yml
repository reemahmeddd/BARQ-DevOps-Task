name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: barq-assessment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env from the safe example
        run: |
          cp .env.example .env
          grep '^PUBLIC_PORT=' .env >> "$GITHUB_ENV"

      - name: Syntax checks
        run: |
          python3 -m py_compile app/*.py validate.py failure_test.py scripts/analyze_logs.py
          bash -n backup.sh
          bash -n restore.sh
          docker compose config --quiet
          docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            "$(docker compose config --images | grep '^nginx')" nginx -t

      - name: Build
        run: docker compose build

      - name: Unit tests (app only, inside the built image)
        run: |
          docker run --rm -v "$PWD/tests:/srv/tests:ro" -w /srv \
            "$(docker compose config --images | grep 'app-01')" python -m unittest discover -s tests -v

      - name: Start and wait until all services are healthy (max 120s)
        run: docker compose up -d --wait --wait-timeout 120

      - name: Validate
        run: python3 validate.py --timeout 90

      - name: Failure test
        run: python3 failure_test.py

      - name: Show state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
